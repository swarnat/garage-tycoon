name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build single-file HTML (Desktop + Mobile)
        run: |
          npm run build:single
          npm run build:single:mobile

      - name: Prepare artifacts
        run: |
          cp dist-single/index.html garage-tycoon.html
          cp dist-single-mobile/mobile.html garage-tycoon-mobile.html

      - name: Create release with HTML artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            garage-tycoon.html
            garage-tycoon-mobile.html
          generate_release_notes: true
          fail_on_unmatched_files: true
